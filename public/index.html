<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fitness Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.5.1/dist/css/tabler.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="page">
    <main class="page-wrapper">
      <div class="page-header d-print-none">
        <div class="container-xl">
          <div class="row g-2 align-items-center">
            <div class="col">
              <h2 class="page-title d-flex align-items-center">
                <img src="/favicon.svg" alt="" width="32" height="32" class="me-2" />
                Fitness Dashboard
              </h2>
              <p id="last-updated" class="text-secondary mb-0"></p>
            </div>
            <div class="col-auto ms-auto">
              <div class="btn-list">
                <a href="https://www.linkedin.com/in/gurpreethanjra/" target="_blank" rel="noopener" class="btn btn-icon" aria-label="LinkedIn profile">
                  <i class="ti ti-brand-linkedin"></i>
                </a>
                <a href="https://github.com/gurpreet-hanjra/fitness-dashboard" target="_blank" rel="noopener" class="btn btn-icon" aria-label="GitHub repository">
                  <i class="ti ti-brand-github"></i>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="page-body">
        <div class="container-xl">
          <p class="text-secondary fs-4 mb-4">
            HealthKit trends meet AI-coached field hockey — live data, real insights, running entirely on Cloudflare's edge.
          </p>
          <div class="row row-deck row-cards">

            <div class="col-12">
              <div id="weight-section" class="card">
                <div class="card-body">
                  <div class="d-flex align-items-baseline mb-3">
                    <div class="subheader"><i class="ti ti-scale text-primary me-1"></i> Weight</div>
                  </div>
                  <div class="d-flex align-items-baseline">
                    <span id="weight-current" class="h1 mb-0 me-2">--</span>
                    <span id="weight-goal" class="text-secondary"></span>
                  </div>
                  <div class="mt-3">
                    <canvas id="weight-chart" height="80"></canvas>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-12">
              <div class="card">
                <div class="card-header">
                  <h3 class="card-title"><i class="ti ti-activity text-primary me-1"></i> Workouts</h3>
                </div>
                <div class="card-body">
                  <div id="workouts-list"></div>
                </div>
              </div>
            </div>

            <div class="col-md-6">
              <div class="card">
                <div class="card-header">
                  <h3 class="card-title"><i class="ti ti-walk text-primary me-1"></i> Steps</h3>
                </div>
                <div class="card-body">
                  <canvas id="steps-chart" height="120"></canvas>
                </div>
              </div>
            </div>

            <div class="col-md-6">
              <div class="card">
                <div class="card-header">
                  <h3 class="card-title"><i class="ti ti-heartbeat text-primary me-1"></i> Heart Rate</h3>
                </div>
                <div class="card-body">
                  <canvas id="hr-chart" height="120"></canvas>
                </div>
              </div>
            </div>

            <div class="col-md-6">
              <div class="card">
                <div class="card-header">
                  <h3 class="card-title"><i class="ti ti-moon text-primary me-1"></i> Sleep</h3>
                </div>
                <div class="card-body">
                  <canvas id="sleep-chart" height="120"></canvas>
                </div>
              </div>
            </div>

            <div class="col-md-6">
              <div class="card">
                <div class="card-header">
                  <h3 class="card-title"><i class="ti ti-percentage text-primary me-1"></i> Body Fat %</h3>
                </div>
                <div class="card-body">
                  <canvas id="body-fat-chart" height="120"></canvas>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/dashboard.js"></script>
</body>
</html>
